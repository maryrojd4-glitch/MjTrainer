
name: Build MjTrainer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract project
        run: |
          mkdir -p "$RUNNER_TEMP/mjtrainer"
          unzip -q "$GITHUB_WORKSPACE/MjTrainer.zip" -d "$RUNNER_TEMP/mjtrainer"

      - name: Build debug APK
        run: |
          set -e

          PROJECT_FILE=$(find "$RUNNER_TEMP/mjtrainer" \
            -name settings.gradle.kts -type f -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cd "$PROJECT_DIR"

          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug \
            -PbuildPythonPath="$(which python)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MjTrainer-apk
          path: |
            ${{ runner.temp }}/mjtrainer/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
